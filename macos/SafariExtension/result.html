<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WorldCapture</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 13px -apple-system, system-ui, sans-serif;
        background: #f2f2f7;
        color: #1c1c1e;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1c1c1e; color: #f2f2f7; }
        .bar { background: rgba(30,30,32,0.9); border-color: #3a3a3c; }
        .stage { background: #000; }
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        background: rgba(255,255,255,0.9);
        backdrop-filter: saturate(180%) blur(20px);
        border-bottom: 1px solid #d1d1d6;
      }
      .title { font-weight: 600; font-size: 14px; }
      .title small { font-weight: 400; opacity: 0.5; margin-left: 8px; }
      .spacer { flex: 1; }
      button {
        padding: 6px 12px;
        font-size: 13px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        background: #007aff;
        color: #fff;
        cursor: pointer;
      }
      button.secondary { background: rgba(120,120,128,0.16); color: inherit; }
      button:disabled { opacity: 0.4; cursor: default; }
      #status { font-size: 12px; opacity: 0.7; min-width: 60px; }
      .zoom { display: inline-flex; border-radius: 8px; overflow: hidden; background: rgba(120,120,128,0.16); }
      .zoom button {
        background: transparent; color: inherit; border-radius: 0;
        padding: 6px 10px; font-weight: 500; font-size: 12px;
      }
      .zoom button.on { background: #007aff; color: #fff; font-weight: 600; }
      .stage {
        padding: 24px;
        text-align: center;
        overflow: auto;
        background: #e5e5ea;
      }
      #shot {
        display: inline-block;
        vertical-align: top;
        max-width: 100%;
        height: auto;
        box-shadow: 0 4px 24px rgba(0,0,0,0.18);
        border-radius: 6px;
        background: #fff;
      }
      .empty { padding: 80px 24px; text-align: center; opacity: 0.5; }
    </style>
  </head>
  <body>
    <div class="bar">
      <span class="title">WorldCapture<small id="dims"></small></span>
      <span class="zoom" id="zoom">
        <button data-zoom="fit" class="on">适应宽度</button>
        <button data-zoom="0.5">50%</button>
        <button data-zoom="1">100%</button>
      </span>
      <span class="spacer"></span>
      <span id="status"></span>
      <button id="copy" class="secondary" disabled>Copy</button>
      <button id="download" disabled>Download PNG</button>
      <button id="open" class="secondary" disabled>Open in WorldCapture</button>
    </div>
    <div class="stage"><img id="shot" alt="Full-page capture" /></div>
    <script src="result.js"></script>
  </body>
</html>
