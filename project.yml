name: WorldCapture
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "15.0"
  generateEmptyDirectories: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 43M5KN7MPD
    PROVISIONING_PROFILE_SPECIFIER: ""
  configs:
    # Debug：Apple Development 本地开发签名（TCC 授权跨重建稳定）
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development"
    # Release：Developer ID Application 分发签名（需付费会员证书，配合公证）
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"

packages:
  # 自动更新（Developer ID 直分发用，非 App Store）。
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.5.0"

targets:
  CaptureKit:
    type: framework
    platform: macOS
    sources:
      - path: macos/Sources/CaptureKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.worldcapture.capturekit
        DEFINES_MODULE: YES
        ENABLE_TESTABILITY: YES
        GENERATE_INFOPLIST_FILE: YES

  WorldCapture:
    type: application
    platform: macOS
    sources:
      - path: macos/Sources/WorldCaptureMac
      - path: macos/App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: CaptureKit
      - package: Sparkle
      - target: SafariExtension
        embed: true
    info:
      path: macos/App/Info.plist
      properties:
        CFBundleDisplayName: WorldCapture
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en, ja]
        # 版本号单一来源 = settings 里的 MARKETING_VERSION / CURRENT_PROJECT_VERSION，
        # 避免 XcodeGen 默认值(1.0/1)与之不一致影响 Sparkle 版本比较。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # TCC 用途文案。这里是开发语言(zh-Hans)的默认值，en/ja 由各 lproj 下的
        # InfoPlist.strings 覆盖。屏幕录制与辅助功能没有对应的 Info.plist 键，
        # 弹窗文案由系统提供，改不了；应用内的引导文案见 Localizable.strings 的 perm.* 。
        #
        # NSAudioCaptureUsageDescription 是独立于麦克风的 TCC 类别，只作用于 Core Audio
        # process taps。本项目的系统音频走 ScreenCaptureKit 的 capturesAudio，随屏幕录制
        # 权限授予，因此这条大概率不会弹窗；保留是为了将来若改用 taps 不至于漏掉。
        NSAudioCaptureUsageDescription: 用于把这台 Mac 正在播放的声音录进屏幕录像。录音只保存在本机，不会上传。
        NSMicrophoneUsageDescription: 用于把你的讲解声录进屏幕录像。仅在你开启「录制时包含麦克风声音」后才会录音，录音只保存在这台 Mac 上。
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
        # Sparkle 自动更新（占位域名，官网定后替换 SUFeedURL）。
        SUFeedURL: https://worldcapture.io/appcast.xml
        SUPublicEDKey: S9o2kOwFSWxEpNJ9z43Jxa15FwBBjVG6lmKXu2Kw8yY=
    entitlements:
      path: macos/App/WorldCapture.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.worldcapture.app
        PRODUCT_NAME: WorldCapture
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES

  SafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: macos/SafariExtension/SafariWebExtensionHandler.swift
      - path: macos/SafariExtension/manifest.json
        buildPhase: resources
      - path: macos/SafariExtension/background.js
        buildPhase: resources
      - path: macos/SafariExtension/content.js
        buildPhase: resources
      - path: macos/SafariExtension/popup.html
        buildPhase: resources
      - path: macos/SafariExtension/popup.js
        buildPhase: resources
      - path: macos/SafariExtension/result.html
        buildPhase: resources
      - path: macos/SafariExtension/result.js
        buildPhase: resources
      - path: macos/SafariExtension/images
        type: folder
        buildPhase: resources
      - path: macos/SafariExtension/vendor
        type: folder
        buildPhase: resources
    entitlements:
      path: macos/SafariExtension/SafariExtension.entitlements
      properties:
        # Safari Web Extension 强制沙盒；否则 pkd 拒绝注册、Safari 里看不到。
        # 写在这里让 `xcodegen generate` 每次都把沙盒键写回，防止被外部清空。
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.worldcapture.app.Extension
        PRODUCT_NAME: WorldCapture Web
        INFOPLIST_FILE: macos/SafariExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"

  CaptureKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: macos/Tests/CaptureKitTests
    dependencies:
      - target: CaptureKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.worldcapture.capturekit-tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WorldCapture:
    build:
      targets:
        WorldCapture: all
        CaptureKitTests: [test]
    test:
      targets:
        - CaptureKitTests
