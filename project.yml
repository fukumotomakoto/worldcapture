name: WorldCapture
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "15.0"
  generateEmptyDirectories: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 43M5KN7MPD
    PROVISIONING_PROFILE_SPECIFIER: ""
  configs:
    # Debug：Apple Development 本地开发签名（TCC 授权跨重建稳定）
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development"
    # Release：Developer ID Application 分发签名（需付费会员证书，配合公证）
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"

packages:
  # 自动更新（Developer ID 直分发用，非 App Store）。
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.5.0"

targets:
  CaptureKit:
    type: framework
    platform: macOS
    sources:
      - path: macos/Sources/CaptureKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.worldcapture.capturekit
        DEFINES_MODULE: YES
        ENABLE_TESTABILITY: YES
        GENERATE_INFOPLIST_FILE: YES

  WorldCapture:
    type: application
    platform: macOS
    sources:
      - path: macos/Sources/WorldCaptureMac
      - path: macos/App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: CaptureKit
      - package: Sparkle
    info:
      path: macos/App/Info.plist
      properties:
        CFBundleDisplayName: WorldCapture
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en, ja]
        # 版本号单一来源 = settings 里的 MARKETING_VERSION / CURRENT_PROJECT_VERSION，
        # 避免 XcodeGen 默认值(1.0/1)与之不一致影响 Sparkle 版本比较。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSAudioCaptureUsageDescription: WorldCapture 需要访问系统音频，以便将电脑声音录入屏幕录像。
        NSMicrophoneUsageDescription: WorldCapture 需要访问麦克风，以便在屏幕录像中加入讲解声音。
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
        # Sparkle 自动更新（占位域名，官网定后替换 SUFeedURL）。
        SUFeedURL: https://worldcapture.io/appcast.xml
        SUPublicEDKey: S9o2kOwFSWxEpNJ9z43Jxa15FwBBjVG6lmKXu2Kw8yY=
    entitlements:
      path: macos/App/WorldCapture.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.worldcapture.app
        PRODUCT_NAME: WorldCapture
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES

  CaptureKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: macos/Tests/CaptureKitTests
    dependencies:
      - target: CaptureKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.worldcapture.capturekit-tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WorldCapture:
    build:
      targets:
        WorldCapture: all
        CaptureKitTests: [test]
    test:
      targets:
        - CaptureKitTests
